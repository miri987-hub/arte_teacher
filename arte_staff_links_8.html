<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTE SPEECH · 강사 전용 링크</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --navy:#1B2A4A;
    --navy-soft:#2E4166;
    --cream:#F6F1E7;
    --page:#EFEAE0;
    --gold:#C9A227;
    --coral:#E2603F;
    --ink:#22252B;
    --ink-soft:#5B5E63;
    --line:rgba(27,42,74,0.14);
    --ok:#2F7A4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(27,42,74,0.07) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:36px 16px 80px;
  }
  #app{width:100%;max-width:480px;}

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
    text-align:center;
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:26px;
    text-align:center;
    color:var(--navy);
    margin:0 0 4px;
  }
  .sub{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 28px;
  }

  .badge{
    background:var(--cream);
    border-radius:16px;
    border:1px solid var(--line);
    margin-bottom:14px;
    box-shadow:0 3px 0 rgba(27,42,74,0.06);
    overflow:hidden;
    position:relative;
  }
  .badge::before{
    content:"";
    position:absolute;
    top:-9px;left:50%;
    transform:translateX(-50%);
    width:34px;height:18px;
    background:var(--page);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
  }
  .badge::after{
    content:"";
    position:absolute;
    top:-2px;left:50%;
    transform:translateX(-50%);
    width:16px;height:16px;
    background:var(--navy);
    border-radius:50%;
  }
  .badge-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 18px 18px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .badge-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--gold);
    letter-spacing:.06em;
    writing-mode:vertical-rl;
    padding-right:2px;
  }
  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:var(--navy);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:16px;
    flex-shrink:0;
  }
  .badge-name{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:17px;
    color:var(--navy);
  }
  .badge-tag{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .badge-chevron{
    margin-left:auto;
    color:var(--navy-soft);
    font-size:18px;
    transition:transform .2s ease;
  }
  .badge.open .badge-chevron{transform:rotate(90deg);}

  .badge-body{
    padding:0 18px 20px;
    border-top:1px dashed var(--line);
    margin-top:2px;
    padding-top:16px;
  }
  .pin-row{display:flex;gap:8px;}
  .pin-row input{
    flex:1;
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    letter-spacing:.08em;
    color:var(--ink);
  }
  .pin-row input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .btn{
    border:none;
    border-radius:10px;
    padding:11px 16px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-navy{background:var(--navy);color:var(--cream);}
  .btn-navy:hover{background:var(--navy-soft);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-outline-danger{background:transparent;color:#a13a26;border:1px solid #e2a894;}
  .err-msg{color:#a13a26;font-size:12px;margin-top:8px;}

  .link-list{display:flex;flex-direction:column;gap:8px;}
  .link-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    text-decoration:none;
    color:var(--ink);
    font-size:14px;
    font-weight:700;
  }
  .link-item:hover{border-color:var(--gold);}
  .link-item .arrow{color:var(--gold);font-size:16px;}
  .link-item .link-icon{flex-shrink:0;color:var(--gold);}
  .link-item .label-text{flex:1;display:flex;align-items:center;gap:10px;}
  .link-empty{
    font-size:12px;color:var(--ink-soft);
    padding:12px 14px;background:#fff;border:1px dashed var(--line);border-radius:10px;
  }
  .lock-again{
    margin-top:10px;
    font-size:12px;
    color:var(--ink-soft);
    background:none;border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    font-family:inherit;
  }

  .branch-row{
    display:flex;
    gap:10px;
    align-items:stretch;
    margin-bottom:18px;
  }
  .branch-panel{
    border:1.5px solid var(--navy);
    border-radius:14px;
    background:var(--cream);
    box-shadow:0 3px 0 rgba(27,42,74,0.06);
    transition:flex-grow .35s ease, flex-basis .35s ease, padding .2s ease;
    overflow:hidden;
  }
  .branch-panel.eq{
    flex:1 1 0;
    min-height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:16px 8px;
  }
  .branch-panel.eq:hover{border-color:var(--gold);}
  .branch-label{text-align:center;}
  .branch-name{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    color:var(--navy);
    font-size:16px;
    line-height:1.35;
    word-break:keep-all;
  }
  .branch-count{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .branch-panel.strip{
    flex:0 0 44px;
    min-height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:10px 0;
  }
  .branch-panel.strip:hover{border-color:var(--gold);}
  .branch-name-vertical{
    writing-mode:vertical-rl;
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    color:var(--navy);
    font-size:13px;
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .branch-panel.expanded{
    flex:1 1 auto;
    min-width:0;
    padding:16px 14px 18px;
  }
  .branch-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .back-link{
    background:none;border:none;
    font-size:12px;color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;font-family:inherit;
    padding:0;
  }
  .branch-name-lg{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    color:var(--navy);
    font-size:15px;
  }

  .footer-admin{
    text-align:center;
    margin-top:26px;
  }
  .footer-admin button{
    background:none;border:none;
    font-size:12px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(27,42,74,0.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal{
    background:var(--cream);
    border-radius:16px;
    padding:26px 22px;
    width:100%;max-width:360px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }
  .modal h2{
    font-family:'Noto Serif KR',serif;
    color:var(--navy);
    font-size:18px;margin:0 0 14px;
  }
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions .btn{flex:1;}

  .admin-wrap{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .admin-title{
    font-family:'Noto Serif KR',serif;
    color:var(--navy);font-size:19px;font-weight:700;margin:0 0 4px;
  }
  .admin-note{font-size:12px;color:var(--ink-soft);margin:0 0 18px;}
  .branch-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .branch-tab{
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    border-radius:20px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .branch-tab-count{font-weight:400;color:var(--ink-soft);font-size:11px;}
  .branch-tab.active{
    border-color:var(--navy);
    background:var(--navy);
    color:var(--cream);
  }
  .branch-tab.active .branch-tab-count{color:var(--cream);opacity:.8;}
  .branch-section{margin-bottom:22px;}
  .branch-section-title{
    font-family:'Noto Serif KR',serif;
    font-weight:700;color:var(--navy);font-size:15px;
    margin:0 0 10px;
    display:flex;align-items:baseline;gap:8px;
  }
  .branch-section-count{font-family:'Pretendard',sans-serif;font-weight:400;font-size:11px;color:var(--ink-soft);}
  .order-btns{display:flex;gap:4px;}
  .order-btns .row-btn{width:26px;height:26px;font-size:11px;}
  .order-btns .row-btn:disabled{opacity:.3;cursor:not-allowed;}
  .teacher-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:14px;
  }
  .field-label{
    font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.05em;
    margin:0 0 4px;display:block;
  }
  .field{margin-bottom:10px;}
  .field input, .field select{
    width:100%;border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;font-size:14px;font-family:inherit;color:var(--ink);
    background:#fff;
  }
  .link-edit-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .link-edit-row input:first-child{flex:0 0 30%;}
  .link-edit-row input:last-child{flex:1;min-width:0;}
  .row-btn{
    flex:0 0 30px;width:30px;height:36px;
    border-radius:8px;border:1px solid var(--line);
    background:#fff;cursor:pointer;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    padding:0;line-height:1;
  }
  .row-btn-del{color:#a13a26;}
  .row-btn-add{color:var(--navy);}
  .row-btn:hover{border-color:var(--gold);}
  .add-row-full{
    width:100%;margin-top:4px;
  }
  .teacher-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .teacher-card-top span{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);
  }
  .del-btn{
    background:none;border:none;color:#a13a26;font-size:12px;
    text-decoration:underline;cursor:pointer;font-family:inherit;
  }
  .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .status-line{font-size:12px;margin-top:10px;min-height:16px;}
  .status-ok{color:var(--ok);}
  .status-err{color:#a13a26;}
  .loading{text-align:center;color:var(--ink-soft);font-size:13px;padding:60px 0;}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
const STORAGE_KEY = "arte-staff-directory";
const LINK_ICON_DEFAULTS = ["구글시트","면접 기출문제 모음집","학생 숙제 시스템","스케줄 관리 시스템"];

function uid(){return Math.random().toString(36).slice(2,9);}

function defaultData(){
  const branches = [
    {id:"able", name:"ABLE"},
    {id:"daegu", name:"ARTE 대구점"},
    {id:"changwon", name:"ARTE 창원점"}
  ];
  const roster = [
    ["able","김미령"], ["able","김민정"], ["able","김나영"],
    ["daegu","대구 강사 01"], ["daegu","대구 강사 02"], ["daegu","대구 강사 03"], ["daegu","대구 강사 04"], ["daegu","대구 강사 05"],
    ["changwon","창원 강사 01"], ["changwon","창원 강사 02"], ["changwon","창원 강사 03"], ["changwon","창원 강사 04"], ["changwon","창원 강사 05"]
  ];
  return {
    adminPassword: "admin1234",
    branches,
    teachers: roster.map(([branchId,name])=>({
      id: uid(),
      branchId,
      name,
      password: "1234",
      links: LINK_ICON_DEFAULTS.map(label=>({label, url:""}))
    }))
  };
}

function normalizeData(d){
  if(!d.branches || !Array.isArray(d.branches) || d.branches.length===0){
    d.branches = [
      {id:"able", name:"ABLE"},
      {id:"daegu", name:"ARTE 대구점"},
      {id:"changwon", name:"ARTE 창원점"}
    ];
  }
  const firstBranchId = d.branches[0].id;
  (d.teachers||[]).forEach(t=>{
    if(!t.branchId || !d.branches.some(b=>b.id===t.branchId)){
      t.branchId = firstBranchId;
    }
  });
  return d;
}

let data = null;
let view = "home";
let activeBranch = null;
let adminBranchTab = null;
let expanded = {};
let unlocked = {};
let pinErrors = {};
let adminModalOpen = false;
let adminAuthError = "";
let adminStatus = {msg:"", ok:true};

let dataSource = "default";

async function loadData(){
  try{
    const res = await fetch("./arte-data.json", {cache:"no-store"});
    if(res.ok){
      data = normalizeData(await res.json());
      dataSource = "file";
      render();
      return;
    }
  }catch(e){}
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      data = normalizeData(JSON.parse(res.value));
      dataSource = "storage";
    } else {
      data = defaultData();
      dataSource = "default";
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), true);
    }
  }catch(e){
    data = defaultData();
    dataSource = "default";
  }
  render();
}

function downloadDataFile(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "arte-data.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function saveData(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data), true); }catch(e){}
  downloadDataFile();
  adminStatus = {msg:"arte-data.json 파일이 다운로드되었습니다. 이 파일을 깃허브 저장소의 arte-data.json과 교체(업로드)해야 실제로 반영됩니다.", ok:true};
  render();
}

function importDataFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.teachers || !Array.isArray(parsed.teachers)) throw new Error("형식 오류");
      data = normalizeData(parsed);
      dataSource = "file";
      adminStatus = {msg:"파일을 불러왔습니다. 수정 후 다시 다운로드해 주세요.", ok:true};
    }catch(err){
      adminStatus = {msg:"올바른 arte-data.json 파일이 아닙니다.", ok:false};
    }
    render();
  };
  reader.readAsText(file);
}

function initials(name){
  const clean = name.replace(/강사|원장|선생님/g,"").trim();
  return clean.slice(0,1) || "?";
}

function linkIcon(label){
  const l = label || "";
  if(l.includes("구글") || l.includes("시트")){
    // timetable icon
    return `<svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="4" x2="9" y2="21"/><line x1="15" y1="4" x2="15" y2="21"/></svg>`;
  }
  if(l.includes("기출") || l.includes("문제")){
    // notebook icon
    return `<svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><line x1="8" y1="8" x2="15" y2="8"/><line x1="8" y1="12" x2="15" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/><line x1="2.5" y1="7" x2="4" y2="7"/><line x1="2.5" y1="12" x2="4" y2="12"/><line x1="2.5" y1="17" x2="4" y2="17"/></svg>`;
  }
  if(l.includes("숙제") || l.includes("학생")){
    // person icon
    return `<svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>`;
  }
  if(l.includes("스케줄") || l.includes("일정")){
    // clock icon
    return `<svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`;
  }
  // generic link icon
  return `<svg class="link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.3 1.3"/><path d="M14 10a4 4 0 0 0-5.7 0L5.7 12.6a4 4 0 0 0 5.7 5.7l1.3-1.3"/></svg>`;
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function renderTeacherBadge(t){
  const isOpen = !!expanded[t.id];
  const isUnlocked = !!unlocked[t.id];
  let bodyHtml = "";
  if(isOpen && !isUnlocked){
    const err = pinErrors[t.id] ? `<div class="err-msg">비밀번호가 올바르지 않습니다.</div>` : "";
    bodyHtml = `
      <div class="badge-body">
        <div class="pin-row">
          <input type="password" inputmode="numeric" placeholder="비밀번호 입력" data-pin-input="${t.id}">
          <button class="btn btn-navy" data-action="unlock" data-id="${t.id}">확인</button>
        </div>
        ${err}
      </div>`;
  } else if(isOpen && isUnlocked){
    const linksHtml = t.links.filter(l=>l.url && l.url.trim()).map(l=>`
      <a class="link-item" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">
        <span class="label-text">${linkIcon(l.label)}<span>${escapeHtml(l.label)}</span></span><span class="arrow">↗</span>
      </a>`).join("");
    const empty = t.links.every(l=>!l.url || !l.url.trim())
      ? `<div class="link-empty">아직 등록된 링크가 없습니다. 관리자에게 문의해 주세요.</div>` : "";
    bodyHtml = `
      <div class="badge-body">
        <div class="link-list">${linksHtml}${empty}</div>
        <button class="lock-again" data-action="lock" data-id="${t.id}">다시 잠그기</button>
      </div>`;
  }
  return `
    <div class="badge ${isOpen ? "open" : ""}">
      <div class="badge-head" data-action="toggle" data-id="${t.id}">
        <div class="avatar">${escapeHtml(initials(t.name))}</div>
        <div>
          <div class="badge-name">${escapeHtml(t.name)}</div>
          <div class="badge-tag">${isUnlocked ? "링크 열람 가능" : "비밀번호 필요"}</div>
        </div>
        <span class="badge-chevron">›</span>
      </div>
      ${bodyHtml}
    </div>`;
}

function renderHome(){
  const branches = data.branches;
  let panels;
  if(activeBranch === null){
    panels = branches.map(b=>{
      const teachers = data.teachers.filter(t=>t.branchId === b.id);
      return `
        <div class="branch-panel eq" data-action="select-branch" data-id="${b.id}">
          <div class="branch-label">
            <div class="branch-name">${escapeHtml(b.name)}</div>
            <div class="branch-count">강사 ${teachers.length}명</div>
          </div>
        </div>`;
    }).join("");
  } else {
    const b = branches.find(x=>x.id===activeBranch) || branches[0];
    const teachers = data.teachers.filter(t=>t.branchId === b.id);
    const list = teachers.length
      ? teachers.map(renderTeacherBadge).join("")
      : `<div class="link-empty">등록된 강사가 없습니다.</div>`;
    panels = `
      <div class="branch-panel expanded">
        <div class="branch-panel-header">
          <button class="back-link" data-action="back-branches">‹ 전체 지점 보기</button>
          <div class="branch-name-lg">${escapeHtml(b.name)}</div>
        </div>
        ${list}
      </div>`;
  }

  return `
    <div class="eyebrow">ARTE SPEECH</div>
    <h1>강사님들 전용 링크모음집 🧡</h1>
    <p class="sub">지점을 먼저 선택한 뒤, 본인 비밀번호를 눌러 들어가세요</p>
    <div class="branch-row">${panels}</div>
    <div class="footer-admin">
      <button data-action="open-admin-login">학원 관리자이신가요?</button>
    </div>
  `;
}

function renderAdminLoginModal(){
  if(!adminModalOpen) return "";
  const err = adminAuthError ? `<div class="err-msg">${escapeHtml(adminAuthError)}</div>` : "";
  return `
    <div class="overlay" data-action="close-admin-overlay">
      <div class="modal" data-action="noop">
        <h2>관리자 로그인</h2>
        <div class="field">
          <input type="password" placeholder="관리자 비밀번호" id="admin-pw-input">
        </div>
        ${err}
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="close-admin-overlay">취소</button>
          <button class="btn btn-navy" data-action="admin-login">입장</button>
        </div>
      </div>
    </div>`;
}

function teacherEditCard(t, isFirst, isLast){
  const branchOptions = data.branches.map(b=>`<option value="${escapeAttr(b.id)}">${escapeHtml(b.name)}</option>`).join("");
  const linkRows = t.links.map((l,li)=>`
    <div class="link-edit-row">
      <input value="${escapeAttr(l.label)}" data-field="link-label" data-id="${t.id}" data-li="${li}" placeholder="링크 이름">
      <input value="${escapeAttr(l.url)}" data-field="link-url" data-id="${t.id}" data-li="${li}" placeholder="https://...">
      <button class="row-btn row-btn-del" data-action="remove-link" data-id="${t.id}" data-li="${li}" title="이 줄 삭제">－</button>
      <button class="row-btn row-btn-add" data-action="add-link" data-id="${t.id}" data-li="${li}" title="아래에 줄 추가">＋</button>
    </div>`).join("");
  return `
    <div class="teacher-card">
      <div class="teacher-card-top">
        <div class="order-btns">
          <button class="row-btn" data-action="move-teacher" data-id="${t.id}" data-dir="up" ${isFirst?"disabled":""} title="위로">▲</button>
          <button class="row-btn" data-action="move-teacher" data-id="${t.id}" data-dir="down" ${isLast?"disabled":""} title="아래로">▼</button>
        </div>
        <button class="del-btn" data-action="delete-teacher" data-id="${t.id}">강사 삭제</button>
      </div>
      <div class="field">
        <span class="field-label">지점</span>
        <select data-field="branch" data-id="${t.id}">${branchOptions.replace(`value="${escapeAttr(t.branchId)}"`, `value="${escapeAttr(t.branchId)}" selected`)}</select>
      </div>
      <div class="field">
        <span class="field-label">이름</span>
        <input value="${escapeAttr(t.name)}" data-field="name" data-id="${t.id}">
      </div>
      <div class="field">
        <span class="field-label">비밀번호</span>
        <input value="${escapeAttr(t.password)}" data-field="password" data-id="${t.id}">
      </div>
      <span class="field-label">링크 (이름 / 주소)</span>
      ${linkRows}
      <button class="btn btn-ghost add-row-full" data-action="add-link-end" data-id="${t.id}">+ 링크 칸 추가</button>
    </div>`;
}

function renderAdmin(){
  const branchMgmtRows = data.branches.map(b=>`
    <div class="link-edit-row">
      <input value="${escapeAttr(b.name)}" data-field="branch-name" data-bid="${b.id}" style="flex:1;" placeholder="지점 이름">
      <button class="row-btn row-btn-del" data-action="delete-branch" data-bid="${b.id}" title="지점 삭제">－</button>
    </div>`).join("");

  if(!adminBranchTab || !data.branches.some(b=>b.id===adminBranchTab)){
    adminBranchTab = data.branches[0] ? data.branches[0].id : null;
  }
  const tabs = data.branches.map(b=>{
    const count = data.teachers.filter(t=>t.branchId===b.id).length;
    const activeCls = b.id === adminBranchTab ? "active" : "";
    return `<button class="branch-tab ${activeCls}" data-action="admin-select-branch" data-bid="${b.id}">${escapeHtml(b.name)} <span class="branch-tab-count">${count}</span></button>`;
  }).join("");

  const currentBranch = data.branches.find(b=>b.id===adminBranchTab);
  let sections = "";
  if(currentBranch){
    const teachers = data.teachers.filter(t=>t.branchId === currentBranch.id);
    const cardsHtml = teachers.map((t,idx)=>teacherEditCard(t, idx===0, idx===teachers.length-1)).join("");
    sections = `
      <div class="branch-section">
        ${cardsHtml || '<div class="link-empty">이 지점에 등록된 강사가 없습니다.</div>'}
        <button class="btn btn-ghost add-row-full" data-action="add-teacher" data-bid="${currentBranch.id}">+ ${escapeHtml(currentBranch.name)}에 강사 추가</button>
      </div>`;
  }

  const statusClass = adminStatus.ok ? "status-ok" : "status-err";

  return `
    <div class="eyebrow">ARTE SPEECH</div>
    <h1>관리자 설정</h1>
    <p class="sub">강사 이름, 비밀번호, 링크를 각각 관리하세요</p>
    <div class="admin-wrap">
      <p class="admin-note">현재 불러온 데이터: ${dataSource === "file" ? "arte-data.json 파일" : dataSource === "storage" ? "Claude 임시 저장소 (외부 호스팅 시에는 적용되지 않음)" : "기본값 (아직 저장된 파일 없음)"}. 민감한 비밀번호(계좌, 개인정보용 비밀번호 등)는 이 PIN으로 재사용하지 마세요.</p>
      <p class="admin-note">일부 강사만 먼저 입력해도 됩니다. 이름/비밀번호/링크가 비어 있는 강사는 저장에 아무 문제가 없고, 홈 화면에서는 빈 링크만 안 보일 뿐입니다.</p>
      <span class="field-label">지점 관리</span>
      ${branchMgmtRows}
      <button class="btn btn-ghost add-row-full" data-action="add-branch" style="margin-bottom:16px;">+ 지점 추가</button>
      <div class="admin-actions" style="margin-bottom:16px;">
        <button class="btn btn-navy" data-action="save-all">저장하기 (arte-data.json 다운로드)</button>
      </div>
      <div class="branch-tabs">${tabs}</div>
      ${sections}
      <div class="admin-actions">
        <button class="btn btn-navy" data-action="save-all">저장하기 (arte-data.json 다운로드)</button>
        <button class="btn btn-ghost" data-action="trigger-import">파일 불러오기</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
        <button class="btn btn-ghost" data-action="close-admin">닫기</button>
        <button class="btn btn-outline-danger" data-action="reset-all">기본값으로 초기화</button>
      </div>
      <p class="admin-note" style="margin-top:8px;">다운로드한 arte-data.json 파일을 index.html과 같은 폴더(깃허브 저장소)에 업로드해서 기존 파일을 교체해야 방문자에게 반영됩니다.</p>
      <div class="status-line ${statusClass}">${escapeHtml(adminStatus.msg)}</div>
      <div class="field" style="margin-top:18px;">
        <span class="field-label">관리자 비밀번호 변경</span>
        <input id="admin-pw-change" placeholder="새 관리자 비밀번호" value="">
      </div>
      <button class="btn btn-ghost" data-action="change-admin-pw">관리자 비밀번호 저장</button>
    </div>
  `;
}

function render(){
  const app = document.getElementById("app");
  if(!data){ app.innerHTML = '<div class="loading">불러오는 중…</div>'; return; }
  let html = view === "admin" ? renderAdmin() : renderHome();
  html += renderAdminLoginModal();
  app.innerHTML = html;
}

document.addEventListener("click", async (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if(action === "select-branch"){
    activeBranch = id;
    render();
  } else if(action === "admin-select-branch"){
    adminBranchTab = el.dataset.bid;
    render();
  } else if(action === "back-branches"){
    activeBranch = null;
    render();
  } else if(action === "toggle"){
    expanded[id] = !expanded[id];
    pinErrors[id] = false;
    render();
  } else if(action === "unlock"){
    const input = document.querySelector(`[data-pin-input="${id}"]`);
    const val = input ? input.value : "";
    const t = data.teachers.find(t=>t.id===id);
    if(t && val === t.password){
      unlocked[id] = true;
      pinErrors[id] = false;
    } else {
      pinErrors[id] = true;
    }
    render();
  } else if(action === "lock"){
    unlocked[id] = false;
    expanded[id] = false;
    render();
  } else if(action === "open-admin-login"){
    adminModalOpen = true;
    adminAuthError = "";
    render();
    const input = document.getElementById("admin-pw-input");
    if(input) input.focus();
  } else if(action === "close-admin-overlay"){
    adminModalOpen = false;
    render();
  } else if(action === "admin-login"){
    const input = document.getElementById("admin-pw-input");
    const val = input ? input.value : "";
    if(val === data.adminPassword){
      adminModalOpen = false;
      view = "admin";
      adminBranchTab = data.branches[0] ? data.branches[0].id : null;
      adminStatus = {msg:"", ok:true};
      render();
    } else {
      adminAuthError = "비밀번호가 올바르지 않습니다.";
      render();
    }
  } else if(action === "close-admin"){
    view = "home";
    adminStatus = {msg:"", ok:true};
    render();
  } else if(action === "add-teacher"){
    const bid = el.dataset.bid || activeBranch || data.branches[0].id;
    data.teachers.push({
      id: uid(),
      branchId: bid,
      name: "새 강사",
      password: "1234",
      links: LINK_ICON_DEFAULTS.map(label=>({label, url:""}))
    });
    render();
  } else if(action === "move-teacher"){
    const dir = el.dataset.dir;
    const t = data.teachers.find(t=>t.id===id);
    if(!t) return;
    const groupIds = data.teachers.filter(x=>x.branchId===t.branchId).map(x=>x.id);
    const posInGroup = groupIds.indexOf(id);
    const swapWithId = dir === "up" ? groupIds[posInGroup-1] : groupIds[posInGroup+1];
    if(!swapWithId) return;
    const i1 = data.teachers.findIndex(x=>x.id===id);
    const i2 = data.teachers.findIndex(x=>x.id===swapWithId);
    [data.teachers[i1], data.teachers[i2]] = [data.teachers[i2], data.teachers[i1]];
    render();
  } else if(action === "add-branch"){
    data.branches.push({id: uid(), name: "새 지점"});
    render();
  } else if(action === "delete-branch"){
    const bid = el.dataset.bid;
    if(data.branches.length <= 1){
      alert("지점은 최소 1개 이상 있어야 합니다.");
      return;
    }
    if(confirm("이 지점을 삭제하시겠습니까? 소속 강사는 다른 지점으로 자동 이동됩니다.")){
      const remaining = data.branches.filter(b=>b.id!==bid);
      const fallbackId = remaining[0].id;
      data.teachers.forEach(t=>{ if(t.branchId === bid) t.branchId = fallbackId; });
      data.branches = remaining;
      render();
    }
  } else if(action === "delete-teacher"){
    if(confirm("이 강사를 삭제하시겠습니까?")){
      data.teachers = data.teachers.filter(t=>t.id!==id);
      render();
    }
  } else if(action === "add-link"){
    const t = data.teachers.find(t=>t.id===id);
    const li = +el.dataset.li;
    if(t) t.links.splice(li+1, 0, {label:"", url:""});
    render();
  } else if(action === "add-link-end"){
    const t = data.teachers.find(t=>t.id===id);
    if(t) t.links.push({label:"", url:""});
    render();
  } else if(action === "remove-link"){
    const t = data.teachers.find(t=>t.id===id);
    const li = +el.dataset.li;
    if(t) t.links.splice(li, 1);
    render();
  } else if(action === "save-all"){
    await saveData();
  } else if(action === "trigger-import"){
    document.getElementById("import-file-input").click();
  } else if(action === "reset-all"){
    if(confirm("모든 데이터를 기본값으로 되돌립니다. 계속할까요?")){
      data = defaultData();
      await saveData();
    }
  } else if(action === "change-admin-pw"){
    const input = document.getElementById("admin-pw-change");
    const val = input ? input.value.trim() : "";
    if(val.length < 4){
      adminStatus = {msg:"비밀번호는 4자 이상으로 설정해 주세요.", ok:false};
      render();
      return;
    }
    data.adminPassword = val;
    await saveData();
  }
});

document.addEventListener("input", (e)=>{
  const t = e.target;
  if(t.dataset.field === "branch-name"){
    const b = data.branches.find(x=>x.id===t.dataset.bid);
    if(b) b.name = t.value;
    return;
  }
  if(t.dataset.field){
    const teacher = data.teachers.find(x=>x.id===t.dataset.id);
    if(!teacher) return;
    if(t.dataset.field === "name") teacher.name = t.value;
    else if(t.dataset.field === "password") teacher.password = t.value;
    else if(t.dataset.field === "link-label") teacher.links[+t.dataset.li].label = t.value;
    else if(t.dataset.field === "link-url") teacher.links[+t.dataset.li].url = t.value;
  }
});

document.addEventListener("change",(e)=>{
  const t = e.target;
  if(t.dataset.field === "branch"){
    const teacher = data.teachers.find(x=>x.id===t.dataset.id);
    if(teacher) teacher.branchId = t.value;
    return;
  }
  if(t.id === "import-file-input" && t.files && t.files[0]){
    importDataFile(t.files[0]);
  }
});

document.addEventListener("keydown",(e)=>{
  if(e.key === "Enter"){
    if(e.target.id === "admin-pw-input"){
      document.querySelector('[data-action="admin-login"]').click();
    } else if(e.target.matches('[data-pin-input]')){
      const id = e.target.getAttribute("data-pin-input");
      document.querySelector(`[data-action="unlock"][data-id="${id}"]`).click();
    }
  }
});

loadData();
</script>
</body>
</html>
